
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="author" content="Jose Erico de Souza">
    <meta name="description" content="Jennifer Chang UI Designer portfolio hero page created for a frontend development project.">

    <title>Jose Erico | Portfolio | Hero Block 5</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=Zilla+Slab:wght@400&display=swap" rel="stylesheet">

    <style>

        /* GENERAL STYLES */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Zilla Slab', serif;
            background-color: #ffffff;
            color: #20212a;
        }

        /* NAVIGATION */

        nav {
            background-color: #ffffff;
            padding: 25px 20px;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        nav a {
            color: #2348c4;
            font-size: 16px;
            text-decoration: underline;
            margin: 0 8px;
        }

        /* HERO BLOCK 5 */

        header {
            min-height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #e9eef5;
            padding: 80px 7%;
        }

        .hero-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;

            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 70px;
        }

        /* LEFT COLUMN */

        .hero-text {
            max-width: 560px;
        }

        .hero-text h1 {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: clamp(55px, 7vw, 100px);
            font-weight: 600;
            line-height: 1;
            letter-spacing: 4px;
            color: #172b4d;
            margin-bottom: 20px;
        }

        .hero-text h2 {
            font-family: 'Zilla Slab', serif;
            font-size: clamp(28px, 3vw, 42px);
            font-weight: 400;
            color: #425b79;
            margin-bottom: 30px;
        }

        .hero-text p {
            font-family: 'Zilla Slab', serif;
            font-size: 24px;
            line-height: 1.5;
            color: #4b5565;
            margin-bottom: 35px;
        }

        /* BUTTONS */

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }

        .btn {
            display: inline-block;
            padding: 16px 30px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-primary {
            color: #ffffff;
            background-color: #274b80;
        }

        .btn-primary:hover {
            background-color: #17345d;
        }

        .btn-secondary {
            color: #274b80;
            border: 2px solid #274b80;
        }

        .btn-secondary:hover {
            background-color: #274b80;
            color: #ffffff;
        }

        /* RIGHT COLUMN */

        .hero-image {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-image img {
            display: block;
            width: 100%;
            max-width: 500px;
            height: auto;
            border-radius: 12px;
            object-fit: cover;
        }

        /* EXTRA CONTENT */

        .portfolio-info {
            padding: 70px 20px;
            text-align: center;
        }

        .portfolio-info h2 {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 38px;
            margin-bottom: 20px;
        }

        .portfolio-info p {
            font-size: 20px;
        }

        /* MOBILE RESPONSIVE */

        @media (max-width: 768px) {

            nav {
                line-height: 2;
            }

            header {
                padding: 60px 25px;
            }

            .hero-container {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            .hero-text {
                text-align: center;
            }

            .hero-text h1 {
                font-size: 55px;
                letter-spacing: 2px;
            }

            .hero-text h2 {
                font-size: 30px;
            }

            .hero-text p {
                font-size: 20px;
            }

            .buttons {
                justify-content: center;
            }

            .hero-image img {
                max-width: 400px;
            }

        }

    </style>

</head>

<body>

    <!-- NAVIGATION -->

    <nav>
        <a href="index-1.html">Hero Block 1</a> |
        <a href="index-2.html">Hero Block 2</a> |
        <a href="index-3.html">Hero Block 3</a> |
        <a href="index-4.html">Hero Block 4</a> |
        <a href="index-5.html">Hero Block 5</a>
    </nav>

    <!-- HERO BLOCK 5 -->

    <header>

        <div class="hero-container">

            <!-- LEFT COLUMN -->

            <div class="hero-text">

                <h1>
                    JENNIFER CHANG
                </h1>

                <h2>
                    UI DESIGNER
                </h2>

                <p>
                    Creating human-friendly interfaces
                    for mobile and web apps.
                </p>

                <div class="buttons">

                    <a href="#work" class="btn btn-primary">
                        Recent work
                    </a>

                    <a href="mailto:hello@example.com"
                       class="btn btn-secondary"
                       onclick="event.preventDefault()">
                        Hire me
                    </a>

                </div>

            </div>

            <!-- RIGHT COLUMN -->

            <div class="hero-image">

                <img
                    src="assets/img/ui-designer.jpg"
                    alt="UI Designer Jennifer Chang portfolio image"
                    width="500"
                    height="550"
                >

            </div>

        </div>

    </header>

    <!-- PORTFOLIO SECTION -->

    <main id="work" class="portfolio-info">

        <h2>Recent Work</h2>

        <p>
            Creative user interface designs for
            modern websites and mobile applications.
        </p>

    </main>

</body>
</html>
