
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hero Block with Video</title>

    <!-- Jose Erico - Student ID: 78589 -->

    <meta name="description"
          content="A hero block with a background video that plays in a continuous loop and includes a tinted overlay.">

    <link rel="preload"
          href="assets/videos/hero-still.jpg"
          as="image">

    <!-- Tailwind CSS v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">

        header {
            @apply relative min-h-[60vh] md:min-h-[80vh]
                   flex flex-col justify-center
                   px-8 lg:px-60 py-12
                   text-center overflow-hidden;
        }
        header video {
            @apply absolute inset-0 w-full h-full
                   object-cover object-center;
        }

        header::before {
            content: "";
            @apply absolute inset-0 z-10
                   bg-linear-to-b
                   from-blue-950/70
                   to-pink-900/30;
        }
        header h1,
        header h2 {
            @apply relative z-20 text-white;
        }

        header h1 {
            @apply text-5xl md:text-7xl font-bold mb-5;
        }
        header h2 {
            @apply text-2xl md:text-4xl font-medium;
        }

    </style>

</head>

<body class="bg-white text-gray-900">
    <header>
        <video
            autoplay
            muted
            loop
            playsinline
            poster="assets/videos/hero-still.jpg">

            <source
                src="assets/videos/hero-video.mp4"
                type="video/mp4">

        </video>

        <h1>Education for Life</h1>

        <h2>A brighter career and future</h2>

    </header>
    <main class="max-w-4xl mx-auto px-8 py-10">

        <p class="text-lg">
            Welcome to my Front-End Development project.
        </p>
        <p class="mt-6">
            <a href="../index.html"
               class="text-blue-700 underline hover:text-blue-900">
                Return to Home
            </a>
        </p>
    </main>

</body>
</html>
